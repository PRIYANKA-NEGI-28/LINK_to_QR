<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fast, free, and modern Link to QR Code Generator. Convert any URL into a high-quality scannable QR code instantly.">
  <title>Link to QR Code Generator</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons for clean UI -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-decorations">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <main class="app-container">
    <div class="qr-card">
      <!-- App Header -->
      <header class="app-header">
        <div class="icon-badge">
          <i class="fa-solid fa-qrcode"></i>
        </div>
        <h1 class="app-title">QR Code Generator</h1>
        <p class="app-subtitle">Turn any URL or website link into a scannable QR code</p>
      </header>

      <!-- Input Form Section -->
      <form id="qr-form" class="qr-form" novalidate>
        <div class="input-group">
          <label for="url-input" class="visually-hidden">Website or Link URL</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-link input-icon"></i>
            <input 
              type="text" 
              id="url-input" 
              placeholder="Enter or paste link (e.g., https://example.com)" 
              autocomplete="off"
              spellcheck="false"
              required
            />
            <button type="button" id="input-clear-btn" class="input-clear-btn" title="Clear input" aria-label="Clear input text">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <!-- Error Notification -->
        <div id="error-message" class="error-message" role="alert" aria-live="polite">
          <i class="fa-solid fa-circle-exclamation error-icon"></i>
          <span id="error-text">Please enter a valid link (e.g., https://example.com)</span>
        </div>

        <!-- Action Buttons -->
        <div class="form-actions">
          <button type="submit" id="generate-btn" class="btn btn-primary">
            <i class="fa-solid fa-bolt"></i>
            <span>Generate QR</span>
          </button>
          <button type="button" id="clear-all-btn" class="btn btn-secondary">
            <i class="fa-solid fa-rotate-left"></i>
            <span>Clear</span>
          </button>
        </div>
      </form>

      <!-- QR Code Output Section (Hidden initially) -->
      <section id="qr-result-section" class="qr-result-section hidden" aria-live="polite">
        <div class="divider">
          <span>QR CODE PREVIEW</span>
        </div>

        <div class="qr-display-box">
          <div class="qr-frame">
            <div id="qrcode" class="qrcode-container"></div>
          </div>
          <div class="url-preview-pill" id="url-preview-pill" title="">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
            <span id="preview-url-text">https://example.com</span>
          </div>
        </div>

        <div class="result-actions">
          <button type="button" id="download-btn" class="btn btn-success">
            <i class="fa-solid fa-download"></i>
            <span>Download QR (PNG)</span>
          </button>
          <button type="button" id="copy-btn" class="btn btn-outline">
            <i class="fa-solid fa-copy"></i>
            <span id="copy-btn-text">Copy Link</span>
          </button>
        </div>
      </section>

      <!-- Footer / Note -->
      <footer class="card-footer">
        <div class="badge-item">
          <i class="fa-solid fa-shield-halved"></i> 100% Client-side & Secure
        </div>
        <div class="badge-item">
          <i class="fa-solid fa-check"></i> High Resolution PNG
        </div>
      </footer>
    </div>
  </main>

  <!-- Toast Notification for actions -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <i class="fa-solid fa-circle-check toast-icon"></i>
    <span id="toast-message">Copied to clipboard!</span>
  </div>

  <!-- Lightweight QR Code Library (qrcodejs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
